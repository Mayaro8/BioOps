services:
  minio:
    image: minio/minio:latest
    container_name: bioops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bioops
      MINIO_ROOT_PASSWORD: bioops-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
