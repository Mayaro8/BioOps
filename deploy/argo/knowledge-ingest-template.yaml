apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bioops-knowledge-ingest
  namespace: bioops-dev
  labels:
    app.kubernetes.io/name: bioops-knowledge-ingest
    app.kubernetes.io/part-of: bioops
spec:
  entrypoint: ingest
  serviceAccountName: bioops-student
  activeDeadlineSeconds: 1800

  ttlStrategy:
    secondsAfterCompletion: 86400

  nodeSelector:
    genoteknodetype: fastmri-cpu

  tolerations:
    - key: yandex.cloud/preemptible
      operator: Equal
      value: "true"
      effect: NoSchedule

  templates:
    - name: ingest
      retryStrategy:
        limit: "1"

      container:
        name: ingest
        image: cr.yandex/crp5l1da4kinv8ofomr5/fastmri-students/bioops:bioops-20260716-130405-msk
        imagePullPolicy: Always
        workingDir: /app

        command:
          - /bin/sh
          - -ec

        args:
          - |
            echo "Waiting for Qdrant at ${QDRANT_URL}"

            qdrant_ready=0

            for attempt in $(seq 1 60); do
              if curl -fsS "${QDRANT_URL}/readyz" >/dev/null; then
                qdrant_ready=1
                break
              fi

              echo "Qdrant not ready: attempt ${attempt}/60"
              sleep 5
            done

            if [ "${qdrant_ready}" -ne 1 ]; then
              echo "Qdrant did not become ready"
              exit 1
            fi

            echo "Checking bundled knowledge documents"

            test -d /app/docs

            SOURCE_COUNT=$(
              find /app/docs -type f                 \( -name '*.md'                 -o -name '*.txt'                 -o -name '*.yaml'                 -o -name '*.yml'                 -o -name '*.pdf' \)                 | wc -l
            )

            echo "Knowledge source files: ${SOURCE_COUNT}"

            if [ "${SOURCE_COUNT}" -eq 0 ]; then
              echo "No knowledge source files found"
              exit 1
            fi

            echo "Starting BioOps Knowledge ingestion"

            python3 -m bioops.rag.ingest

            echo "success" > /tmp/ingest-status.txt
            echo "Knowledge ingestion completed successfully"

        envFrom:
          - configMapRef:
              name: bioops-config
          - secretRef:
              name: bioops-secrets

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"

      outputs:
        parameters:
          - name: ingest-status
            valueFrom:
              path: /tmp/ingest-status.txt
