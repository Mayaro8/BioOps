apiVersion: v1
kind: ServiceAccount
metadata:
  name: bioops-executor
  namespace: bioops-dev
  labels:
    app.kubernetes.io/part-of: bioops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bioops-executor
  namespace: bioops-dev
  labels:
    app.kubernetes.io/part-of: bioops
rules:
  # BioOps agents inspect workflow pods, logs, and Kubernetes events.
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch

  # SubmitMaster and Batch Status inspect and submit Argo workflows.
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  # WorkflowTemplates are installed separately but must be readable.
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtemplates
    verbs:
      - get
      - list
      - watch

  # Required by the Argo workflow executor.
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bioops-executor
  namespace: bioops-dev
  labels:
    app.kubernetes.io/part-of: bioops
subjects:
  - kind: ServiceAccount
    name: bioops-executor
    namespace: bioops-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bioops-executor
