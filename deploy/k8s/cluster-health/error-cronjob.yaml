apiVersion: batch/v1
kind: CronJob
metadata:
  name: bioops-cluster-error-monitor
  namespace: bioops-dev
  labels:
    app: bioops
    component: cluster-error-monitor
    epic: c
spec:
  schedule: "*/30 * * * *"
  timeZone: "Europe/Moscow"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300

      template:
        metadata:
          labels:
            app: bioops
            component: cluster-error-monitor
            epic: c

        spec:
          serviceAccountName: bioops-student
          restartPolicy: Never

          nodeSelector:
            genoteknodetype: fastmri-cpu

          tolerations:
            - key: yandex.cloud/preemptible
              operator: Equal
              value: "true"
              effect: NoSchedule

          containers:
            - name: monitor
              image: cr.yandex/crp5l1da4kinv8ofomr5/fastmri-students/bioops:cluster-health-eta-20260717-104554-msk
              imagePullPolicy: Always

              command:
                - python3
                - -m
                - bioops.jobs.cluster_health_monitor
                - --mode
                - errors

              envFrom:
                - configMapRef:
                    name: bioops-config

                - secretRef:
                    name: bioops-secrets

              env:
                - name: PYTHONPATH
                  value: /app/src

                - name: ALERT_CHANNEL
                  value: browser

                - name: BIOOPS_ALERT_URL
                  value: http://bioops-api-internal:8000/internal/alerts

              volumeMounts:
                - name: agents-config
                  mountPath: /app/configs/agents.yaml
                  subPath: agents.yaml
                  readOnly: true

          volumes:
            - name: agents-config
              configMap:
                name: bioops-agents-config
