agents:
  general:
    enabled: true
    description: Fallback agent for greetings, unclear requests, and unsupported tasks.

  knowledge:
    enabled: true
    description: Answers questions about BioOps documentation, pipeline metadata, source code, inputs, outputs, and explanations.

  cluster_health:
    enabled: true
    description: Checks Kubernetes cluster health, pods, logs, unhealthy containers, running steps, cost, and ETA.
    namespace: bioops-dev
    request_timeout_seconds: 5
    log_tail_lines: 50
    recent_error_minutes: 60
    cost:
      mode: local_free
      currency: rub
    step_eta_minutes:
      bam-to-gvcf: 120
      gvcf-to-vcf: 45
      transfer-bam: 10
      transfer-vcf: 10

  review:
    enabled: true
    description: Reviews repositories, PRs/MRs, code changes, risks, style, logic issues, and missing tests.

  submit_master:
    enabled: true
    description: Generates configuration, launches workflows, and performs explicitly confirmed targeted retries.
    argo_namespace: bioops-dev
    argo_service_name: argo-server
    argo_local_port: 2746
    argo_remote_port: 2746
    argo_ui_url: https://158.160.184.15:2746
    argo_workflow_template: bioops-submit-master-local
    launch_namespace: bioops-dev
    launch_workflow_template: bioops-fastq-mock
    config_mount_root: /mnt/pipeline-v3.0
    workflow_name_prefix: bioops-submit-master
    batch_label: bioops.dev/batch-id
    sample_label: bioops.dev/sample-id
    workflow_page_size: 100
    pod_page_size: 200
    max_listed_items: 10
    d5_max_retries: 2
    step_patterns:
      config-creator:
        - config-creator
        - config_creator
      submit-master:
        - submit-master
        - submit_master
        - submit-master-print
      validate-fastq:
        - validate-fastq
      fastqc:
        - fastqc
      trim-adapters:
        - trim-adapters
      align-reference:
        - align-reference
      sort-bam:
        - sort-bam
      mark-duplicates:
        - mark-duplicates
      base-recalibration:
        - base-recalibration
      call-variants:
        - call-variants
      filter-variants:
        - filter-variants
      annotate-report:
        - annotate-report
      haplotypecaller:
        - haplotypecaller
        - haplotype-caller
      gvcf-to-vcf:
        - gvcf-to-vcf
        - gvcf_to_vcf
      beagle:
        - beagle
      transfer-vcf:
        - transfer-vcf
        - transfer_vcf
        - vcf
      transfer-bam:
        - transfer-bam
        - transfer_bam
        - bam

  batch_status:
    enabled: true
    description: Owns persisted and live status plus D3 monitoring and D4 failure reports.
    argo_namespace: bioops-dev
    argo_workflow_template: bioops-submit-master-local
    workflow_name_prefix: bioops-submit-master
    workflow_label_selector: bioops.dev/workload=submit-master
    sync_interval_minutes: 30
    stale_after_minutes: 30
    google_sheet:
      enabled: false
      spreadsheet_id: ""
      worksheet_name: batch_status
    db_path: /data/bioops_batch_status.sqlite3

  storage:
    enabled: true
    description: Answers read-only bucket inventory questions about paths, object counts, size, file types, storage classes, and inventory freshness.
    bucket_name: genotek-testing
    inventory_path: data/bucket_inventory.csv
    inventory_date: ""
    max_listed_files: 50
    known_name_suffixes:
      - beagle.imputation.vcf.gz
      - imputation.vcf.gz
