apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-status-sync
  namespace: bioops-dev
  labels:
    app.kubernetes.io/name: batch-status-sync
    app.kubernetes.io/part-of: bioops
spec:
  schedule: "*/5 * * * *"
  timeZone: "Europe/Moscow"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: batch-status-sync
            app.kubernetes.io/part-of: bioops
        spec:
          serviceAccountName: bioops-student
          restartPolicy: Never
          nodeSelector:
            genoteknodetype: fastmri-cpu
          tolerations:
          - key: yandex.cloud/preemptible
            operator: Equal
            value: 'true'
            effect: NoSchedule
          containers:
          - name: batch-status-sync
            image: cr.yandex/crp5l1da4kinv8ofomr5/fastmri-students/bioops:cluster-health-eta-20260717-104554-msk
            imagePullPolicy: Always
            command:
            - /bin/sh
            - -ec
            args:
            - "echo \"Starting Batch Status synchronization\"\n\npython3 -m bioops.jobs.batch_status_sync\
              \ \\\n  --limit 100 \\\n  --no-sheet\n\necho \"Exporting Batch Status\
              \ database\"\n\npython3 -m bioops.jobs.batch_status_export \\\n  --db-path\
              \ \"${BATCH_STATUS_DB_PATH}\" \\\n  --csv-path /data/batch_status.csv\
              \ \\\n  --json-path /data/batch_status.json \\\n  --limit 1000\n\necho\
              \ \"Batch Status synchronization completed\"\n"
            envFrom:
            - configMapRef:
                name: bioops-config
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
            volumeMounts:
            - name: agents-config
              mountPath: /app/configs/agents.yaml
              subPath: agents.yaml
              readOnly: true
            - name: batch-status-db
              mountPath: /data
          volumes:
          - name: agents-config
            configMap:
              name: bioops-agents-config
          - name: batch-status-db
            persistentVolumeClaim:
              claimName: bioops-batch-status-db
  suspend: true
