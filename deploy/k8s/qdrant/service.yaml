apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: bioops-dev
  labels:
    app: qdrant
    app.kubernetes.io/part-of: bioops
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
