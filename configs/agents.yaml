agents:
  general:
    enabled: true
    description: Fallback agent for greetings, unclear requests, and unsupported tasks.
  knowledge:
    enabled: true
    description: Answers questions about BioOps documentation, pipeline metadata,
      source code, inputs, outputs, and explanations.
  cluster_health:
    enabled: true
    description: Checks Kubernetes cluster health, pods, logs, unhealthy containers,
      running steps, cost, and ETA.
    namespace: bioops
    request_timeout_seconds: 5
    log_tail_lines: 50
    cost:
      mode: local_free
      currency: rub
    step_eta_minutes:
      bam-to-gvcf: 120
      gvcf-to-vcf: 45
      transfer-bam: 10
      transfer-vcf: 10
  review:
    enabled: true
    description: Reviews repositories, PRs/MRs, code changes, risks, style, logic
      issues, and missing tests.
  submit_master:
    enabled: true
    description: Opens company Argo UI for launching the SubmitMaster workflow.
    argo_namespace: bioops-dev
    argo_service_name: argo-server
    argo_local_port: 2746
    argo_remote_port: 2746
    argo_ui_url: https://158.160.184.15:2746
    argo_workflow_template: bioops-submit-master-local
    workflow_name_prefix: bioops-submit-master
    recent_workflow_limit: 5
    step_patterns:
      config-creator:
      - config-creator
      - config_creator
      submit-master:
      - submit-master
      - submit_master
      - submit-master-print
      haplotypecaller:
      - haplotypecaller
      - haplotype-caller
      transfer-vcf:
      - transfer-vcf
      - transfer_vcf
      - vcf
      transfer-bam:
      - transfer-bam
      - transfer_bam
      - bam
  submit_master:
  enabled: true
  description: "Launches, monitors, reports, and safely retries Submit Master Argo workflows."