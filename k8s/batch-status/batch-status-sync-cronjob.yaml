apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-status-sync
  namespace: bioops-dev
spec:
  schedule: "*/15 * * * *"
  timeZone: "Europe/Moscow"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: bioops-student
          restartPolicy: Never
          containers:
            - name: batch-status-sync
              image: cr.yandex/crp5l1da4kinv8ofomr5/fastmri-students/bioops:batch-status-csv
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -lc
                - |
                  python3 -m bioops.jobs.batch_status_sync \
                    --limit 100 \
                    --no-sheet \
                    --db-path /data/bioops_batch_status.sqlite3

                  python3 -m bioops.jobs.batch_status_export \
                    --db-path /data/bioops_batch_status.sqlite3 \
                    --csv-path /data/batch_status.csv \
                    --json-path /data/batch_status.json \
                    --limit 1000
              volumeMounts:
                - name: batch-status-db
                  mountPath: /data
          volumes:
            - name: batch-status-db
              persistentVolumeClaim:
                claimName: bioops-batch-status-db
