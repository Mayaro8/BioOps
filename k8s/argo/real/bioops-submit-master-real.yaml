apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bioops-submit-master-local
  namespace: argo
spec:
  serviceAccountName: bioops-submit-master
  entrypoint: config-creator-real-submitmaster-print

  arguments:
    parameters:
      - name: batch_id
        value: batch140325
      - name: batch_date_id
        value: "140325"
      - name: run_num
        value: "1"
      - name: run_id
        value: run001
      - name: samples_ids_str
        value: sample1,sample2
      - name: stage
        value: "2"
      - name: steps_order
        value: haplotypecaller,transfer_vcf
      - name: seq_type
        value: illumina
      - name: mode
        value: test
      - name: cluster_name
        value: "3"
      - name: mongo_cluster_name
        value: "5"
      - name: namespace
        value: argo
      - name: config_path
        value: generated/submit-master-config.json
      - name: input_paths_list
        value: s3://mock/input
      - name: runs_list
        value: run001
      - name: tel_token
        value: dummy-token
      - name: tel_chat
        value: dummy-chat

  volumes:
    - name: pipeline-v3
      persistentVolumeClaim:
        claimName: bioops-pipeline-v3-pvc

  templates:
    - name: config-creator-real-submitmaster-print
      dag:
        tasks:
          - name: config-creator
            template: run-real-config-creator

          - name: submit-master-print
            dependencies:
              - config-creator
            template: print-submitmaster-config

    - name: run-real-config-creator
      container:
        image: bioops-config-creator:local
        imagePullPolicy: IfNotPresent
        command:
          - bash
          - -lc
        args:
          - |
            set -euxo pipefail

            echo "=== Running real Config Creator ==="
            cd /app

            echo "Files in /app:"
            ls -la

            export batch_id="{{workflow.parameters.batch_id}}"
            export batch_date_id="{{workflow.parameters.batch_date_id}}"
            export run_num="{{workflow.parameters.run_num}}"
            export run_id="{{workflow.parameters.run_id}}"
            export samples_ids_str="{{workflow.parameters.samples_ids_str}}"

            export stage="{{workflow.parameters.stage}}"
            export steps_order="{{workflow.parameters.steps_order}}"
            export seq_type="{{workflow.parameters.seq_type}}"
            export seq_typ="{{workflow.parameters.seq_type}}"
            export mode="{{workflow.parameters.steps_order}}"

            export cluster="{{workflow.parameters.cluster_name}}"
            export cluster_num="{{workflow.parameters.cluster_name}}"
            export mongo_cluster="{{workflow.parameters.mongo_cluster_name}}"
            export mongo_cluster_label="{{workflow.parameters.mongo_cluster_name}}"
            export namespace="{{workflow.parameters.namespace}}"

            export input_paths_list="{{workflow.parameters.input_paths_list}}"
            export runs_list="{{workflow.parameters.runs_list}}"
            export tel_token="{{workflow.parameters.tel_token}}"
            export tel_chat="{{workflow.parameters.tel_chat}}"

            echo "Environment prepared."
            echo "stage=${stage}"
            echo "steps_order=${steps_order}"
            echo "seq_type=${seq_type}"
            echo "seq_typ=${seq_typ}"

            echo "Running handler.sh..."
            set +e
            bash -x handler.sh
            HANDLER_RC=$?
            set -e
            echo "handler.sh exit code: ${HANDLER_RC}"
            echo "Local MVP: ignoring handler.sh S3 upload failure and using local generated JSON."

            echo "Searching for generated JSON..."
            find /app /mnt/pipeline-v3.0 -name "*.json" -type f -print || true

            GENERATED_JSON="$(find /app /mnt/pipeline-v3.0 -name "*.json" -type f -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)"

            if [ -z "${GENERATED_JSON}" ]; then
              echo "ERROR: no JSON was generated by Config Creator"
              exit 1
            fi

            echo "Generated JSON: ${GENERATED_JSON}"

            mkdir -p /mnt/pipeline-v3.0/generated
            cp "${GENERATED_JSON}" "/mnt/pipeline-v3.0/{{workflow.parameters.config_path}}"

            echo "Copied JSON to:"
            echo "/mnt/pipeline-v3.0/{{workflow.parameters.config_path}}"

            echo "Generated SubmitMaster JSON:"
            cat "/mnt/pipeline-v3.0/{{workflow.parameters.config_path}}"
        volumeMounts:
          - name: pipeline-v3
            mountPath: /mnt/pipeline-v3.0

    - name: print-submitmaster-config
      container:
        image: bioops-submit-master:local
        imagePullPolicy: IfNotPresent
        command:
          - bash
          - -lc
        args:
          - |
            set -euxo pipefail

            echo "=== SubmitMaster image is running, but not launching yet ==="

            CONFIG="/mnt/pipeline-v3.0/{{workflow.parameters.config_path}}"

            echo "Reading generated config:"
            cat "${CONFIG}"

            echo "Checking important SubmitMaster files:"
            ls -la /app
            test -f /app/main.py
            test -f /app/argo.py

            echo "Checking Argo CLI:"
            argo version --short

            echo "=== Patching config for local Argo MVP ==="
            python -c 'import json; from pathlib import Path; p=Path("/mnt/pipeline-v3.0/generated/submit-master-config.json"); data=json.loads(p.read_text()); [w.update({"k8s_cluster_name":"","namespace":"argo"}) for w in data]; p.write_text(json.dumps(data, indent=2))'

            echo "Patched local SubmitMaster config:"
            cat "${CONFIG}"

            echo "=== Launching real SubmitMaster ==="
            cd /app
            python main.py --config "${CONFIG}"
        volumeMounts:
          - name: pipeline-v3
            mountPath: /mnt/pipeline-v3.0
