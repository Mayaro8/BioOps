apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bioops-workflow-executor
  namespace: bioops-dev
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bioops-workflow-executor
  namespace: bioops-dev
subjects:
  - kind: ServiceAccount
    name: bioops-student
    namespace: bioops-dev
roleRef:
  kind: Role
  name: bioops-workflow-executor
  apiGroup: rbac.authorization.k8s.io
