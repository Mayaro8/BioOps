---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bioops-bucket-inventory
  namespace: bioops-dev
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bioops-bucket-inventory-exporter
  namespace: bioops-dev
spec:
  suspend: true
  schedule: "0 3 * * *"
  timeZone: "Europe/Moscow"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: bioops
            component: bucket-inventory-exporter
        spec:
          restartPolicy: Never
          containers:
            - name: bucket-inventory-exporter
              # TODO: replace with the current Yandex Container Registry image before activation.
              image: cr.yandex/replace-me/bioops:replace-me
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mkdir -p /data/inventories
                  export BUCKET_INVENTORY_PATH="/data/inventories/bucket_inventory_$(date -u +%Y-%m-%d).csv"
                  python -m bioops.jobs.export_bucket_inventory
              env:
                - name: S3_ENDPOINT_URL
                  value: "http://minio:9000"
                - name: BUCKET_NAME
                  value: "genotek-testing"
                - name: BUCKET_PREFIX
                  value: ""
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: bioops-s3-secret-placeholder
                      key: S3_ACCESS_KEY_ID
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: bioops-s3-secret-placeholder
                      key: S3_SECRET_ACCESS_KEY
              volumeMounts:
                - name: bucket-inventory
                  mountPath: /data
          volumes:
            - name: bucket-inventory
              persistentVolumeClaim:
                claimName: bioops-bucket-inventory
