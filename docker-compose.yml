services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bioops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  bioops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioops-app
    working_dir: /app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - QDRANT_URL=http://localhost:6333
      - QDRANT_COLLECTION=bioops_knowledge
    volumes:
      - .:/app
      - ~/.kube:/root/.kube:ro
      - ~/.minikube:/root/.minikube:ro
    depends_on:
      - qdrant
    stdin_open: true
    tty: true
    network_mode: host

volumes:
  qdrant_storage: